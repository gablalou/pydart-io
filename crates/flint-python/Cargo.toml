[package]
name = "flint-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_flint"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }
pyo3-arrow = "0.19.0"
arrow = "59.1.0"
numpy = "0.29.0"
thiserror = "2"
flint-core = { path = "../flint-core" }
