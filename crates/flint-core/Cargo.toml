[package]
name = "flint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "flint_core"
crate-type = ["rlib"]

[dependencies]
arrow = "59.1.0"

[dev-dependencies]
allocation-counter = "0.8"

# Plan 03's D-06b zero-copy allocation-counting proof lives at the repo-root `tests/rust/` path
# (locked by 01-PATTERNS.md / 01-03-PLAN.md), not this crate's own `tests/` directory -- an
# explicit `[[test]]` entry with `path` is required for `cargo test -p flint-core --test
# zero_copy_alloc` to find it there.
[[test]]
name = "zero_copy_alloc"
path = "../../tests/rust/zero_copy_alloc.rs"

# Assumption A1 probe (RESEARCH.md Assumptions Log A1): proves arrow::compute::concat handles
# DictionaryArray/TimestampArray(tz)/DurationArray generically, de-risking Plans 03-04's reliance
# on the existing multi-chunk concat fallback -- mirrors the zero_copy_alloc entry above.
[[test]]
name = "concat_generic_arrays"
path = "../../tests/rust/concat_generic_arrays.rs"
