[package]
name = "pydart-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pydart_core"
crate-type = ["rlib"]

[dependencies]
arrow = "59.1.0"
parquet = "59.1.0"

[dev-dependencies]
allocation-counter = "0.8"

# Plan 03's D-06b zero-copy allocation-counting proof lives at the repo-root `tests/rust/` path
# (locked by 01-PATTERNS.md / 01-03-PLAN.md), not this crate's own `tests/` directory -- an
# explicit `[[test]]` entry with `path` is required for `cargo test -p pydart-core --test
# zero_copy_alloc` to find it there.
[[test]]
name = "zero_copy_alloc"
path = "../../tests/rust/zero_copy_alloc.rs"

# Assumption A1 probe (RESEARCH.md Assumptions Log A1): proves arrow::compute::concat handles
# DictionaryArray/TimestampArray(tz)/DurationArray generically, de-risking Plans 03-04's reliance
# on the existing multi-chunk concat fallback -- mirrors the zero_copy_alloc entry above.
[[test]]
name = "concat_generic_arrays"
path = "../../tests/rust/concat_generic_arrays.rs"

# Assumption A6 probe (RESEARCH.md Assumptions Log A6, mandatory Wave-0 gate): proves arrow-rs's
# ArrowWriter/ParquetRecordBatchReaderBuilder default (embedded ARROW:schema metadata) round-trip
# preserves DataType::Dictionary (with dict_is_ordered) and an exact non-UTC tz string, before
# Plans 02-04 build on that assumption -- mirrors the zero_copy_alloc/concat_generic_arrays
# entries above.
[[test]]
name = "parquet_dictionary_tz_roundtrip"
path = "../../tests/rust/parquet_dictionary_tz_roundtrip.rs"

# Plan 03 Task 1: PARQ-04 skip-engagement integration probe -- proves surviving_row_groups (Task 2)
# genuinely engages the row-group-skip decision against a real 3-row-group Parquet file's own
# written statistics, not merely that final rows are correct -- mirrors the entries above.
[[test]]
name = "parquet_row_group_pruning"
path = "../../tests/rust/parquet_row_group_pruning.rs"
