[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "flint"
version = "0.1.0"
description = "A Rust-backed, zero-copy pandas <-> Arrow interop layer (leaner than pyarrow)."
# NOTE: RESEARCH.md pins numpy==2.5.1 as a dev/test dependency, which requires Python>=3.12;
# uv's resolver requires requires-python to cover every declared dependency (dev included), so
# this floor tracks the dev-dependency set actually installed in this environment. The shipped
# wheel's abi3-py39 build target (crates/flint-python's `abi3-py39` PyO3 feature) is a separate,
# broader compatibility floor for consumers and is unaffected by this dev-environment constraint.
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
# Runtime dependencies intentionally empty: pyarrow/polars/duckdb/pandas are dev/test-only
# (see .claude/CLAUDE.md "What NOT to Use" — flint must stay leaner than pyarrow).
dependencies = []

[tool.maturin]
manifest-path = "crates/flint-python/Cargo.toml"
module-name = "flint._flint"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[dependency-groups]
dev = [
    "duckdb==1.5.4",
    "hypothesis==6.156.6",
    "maturin==1.14.1",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "polars==1.42.1",
    "pyarrow==25.0.0",
    "pytest==9.1.1",
]

# Local full-stack dev workflow (uv-compatible per PROJECT.md constraint):
#   uv sync --dev             # install dev/test dependencies (pandas, pyarrow, polars, duckdb,
#                              #   numpy, pytest, hypothesis) into the uv-managed venv
#   uv run maturin develop    # compile the Rust extension and install it into that venv
#   uv run pytest             # run the Python test suite
#
# One-liner: uv run maturin develop && uv run pytest
