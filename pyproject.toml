[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "pydart-io"
version = "0.1.0"
description = "A Rust-backed, zero-copy pandas <-> Arrow interop layer (leaner than pyarrow)."
# NOTE (D-35): requires-python floor is >=3.11, matching the actual compiled wheel target --
# crates/pydart-python's PyO3 `abi3-py311` feature (not `abi3-py39`; that stale claim is
# corrected here). The `numpy==2.5.1` exact dev-dependency pin previously forced this floor to
# >=3.12 (numpy 2.5.x dropped Python 3.11 support), which was a resolver artifact, not an actual
# requirement of this project's own code -- the numpy dev pin below is now a range
# (`>=2.3,<2.6`) so uv's universal resolver can select numpy 2.4.x for a 3.11 interpreter and
# 2.5.x for 3.12+ within a single uv.lock (RESEARCH.md Pitfall 4 / Assumption A1).
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
# Runtime dependencies intentionally empty: pyarrow/polars/duckdb/pandas are dev/test-only
# (see .claude/CLAUDE.md "What NOT to Use" — pydart must stay leaner than pyarrow).
dependencies = []

[tool.maturin]
manifest-path = "crates/pydart-python/Cargo.toml"
module-name = "pydart._pydart"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[dependency-groups]
dev = [
    "duckdb==1.5.4",
    "hypothesis==6.156.6",
    "maturin==1.14.1",
    "numpy>=2.3,<2.6",
    "pandas==3.0.3",
    "polars==1.42.1",
    "psutil>=7.2,<8",
    "pyarrow==25.0.0",
    "pytest==9.1.1",
    "pytest-benchmark>=5.2,<6",
]

# Local full-stack dev workflow (uv-compatible per PROJECT.md constraint):
#   uv sync --dev             # install dev/test dependencies (pandas, pyarrow, polars, duckdb,
#                              #   numpy, pytest, hypothesis) into the uv-managed venv
#   uv run maturin develop    # compile the Rust extension and install it into that venv
#   uv run pytest             # run the Python test suite
#
# One-liner: uv run maturin develop && uv run pytest
